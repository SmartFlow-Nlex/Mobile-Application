# Render Blueprint for the SmartFlow NLEX backend.
#
# Deploys ONLY the Express backend (the chatbot and the corridor proxy). Auth,
# community posts and media already live in Supabase and need no server of ours.
#
# Why the build runs from the repo root rather than backend/: this is an npm
# workspaces monorepo and backend depends on @smartflow/shared, which exists
# only as a sibling folder. Installing inside backend/ alone would send npm to
# the public registry looking for a package that was never published. The cost
# is that the root install also pulls the Expo/React Native frontend packages,
# which makes the first build a few minutes long.
services:
  - type: web
    name: smartflow-backend
    runtime: node
    plan: free
    # Closest region to the Philippines; switch to oregon if singapore is busy.
    region: singapore
    # --include=dev is load-bearing. NODE_ENV=production is set below for the
    # running server, but npm reads the same variable during the build and
    # omits devDependencies - which is where @types/express, @types/cors and
    # typescript itself live. Without this the install succeeds and then tsc
    # fails with TS7016 "Could not find a declaration file for module
    # 'express'". The types are only needed to compile, never at runtime.
    buildCommand: npm install --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # The mobile app is not a browser and sends no Origin header, so this is
      # not the security boundary it would be for a web app.
      - key: CORS_ORIGIN
        value: "*"
      - key: QWEN_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: QWEN_MODEL
        value: qwen/qwen3.8-flash
      - key: LLM_ZDR
        value: "true"
      # sync: false keeps these OUT of the repo - Render prompts for them in the
      # dashboard. The LLM key must never be committed.
      - key: QWEN_API_KEY
        sync: false
      # The dashboard/Waze system is deployed at the end of development. Until
      # then this points nowhere reachable, and that is handled: the assistant
      # reports the data as unavailable rather than inventing traffic. Change it
      # in Render's dashboard when the dashboard backend goes live - no code
      # change and no redeploy of the mobile app needed.
      - key: CORRIDOR_API_URL
        value: http://localhost:4000
